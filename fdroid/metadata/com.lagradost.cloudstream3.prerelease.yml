Name: CloudStream (Pre-release)
Summary: Pre-release testing build for Cloudstream.
Description: |-
    Cloudstream Pre-release is the bleeding-edge version of Cloudstream. It includes the latest features, experimental updates, and bug fixes before they are pushed to the stable release. Suitable for testing and early adopters.

    Key features:

    - Bleeding-edge features and updates before public release
    - Early access to experimental improvements and fixes
    - Completely ad-free experience
    - No analytics, telemetry, or user tracking
    - Offline downloads for local media playback
    - Full Chromecast support
    - Integrated bookmarks, history, and episode tracking
    - Modular extension system for external providers
    - Optimized interface for both phones and Android TV

